user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # LGPD: o log de acesso NÃO grava a query string (que pode conter datas/filtros)
    log_format sem_query '$remote_addr [$time_local] "$request_method $uri $server_protocol" '
                         '$status $body_bytes_sent $request_time "$http_user_agent"';
    access_log /var/log/nginx/access.log sem_query;

    sendfile        on;
    server_tokens   off;
    keepalive_timeout 30s;
    client_max_body_size 1m;
    client_body_timeout 15s;
    client_header_timeout 15s;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Limites de requisições (proteção contra força bruta e abuso)
    limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=api:10m   rate=30r/s;
    limit_req_status 429;

    include /etc/nginx/conf.d/*.conf;
}
